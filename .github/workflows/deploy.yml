name: deploy

# Builds, scans and pushes every image in platform.yaml once per commit, with
# its SBOM, and deploys it to every dev tier Environment, on every push to main
# and by hand. Run by hand on a commit whose images exist, it builds nothing
# and deploys those. All steps live in the reusable workflow in tl-platform,
# pinned by tag. Change nothing here but the token: the images restore the
# framework's packages from GitHub Packages with the organisation secret
# PACKAGES_READ_TOKEN, or the workflow's token without it, as in ci.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: TrislabCompany/tl-platform/.github/workflows/app-deploy.yml@app-workflows/v0.4.0-rc.1
    secrets:
      packages-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
