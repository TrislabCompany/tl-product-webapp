name: ci

# Builds the three images in platform.yaml, runs the tests, scans the images
# with Trivy and checks platform.yaml, on every PR and every push to main.
# Pushes nothing. All steps live in the reusable workflow in tl-platform,
# pinned by tag; the job is named ci like the one it calls, so the required
# check is `ci / ci`. Change only the test command and the token here. The
# integration tests start their own throw-away Postgres. The framework's
# packages are on GitHub Packages: the organisation secret PACKAGES_READ_TOKEN
# (or the workflow's token without it) is passed as packages-token, which the reusable workflow gives the test command as
# PACKAGES_TOKEN (nuget.config reads it) and every image build as a BuildKit
# secret. pnpm trusts a token only in ~/.npmrc, so the test command writes it
# there. The organisation must give this repository the secret
# (docs/deployment.md).

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
      packages: read
    uses: TrislabCompany/tl-platform/.github/workflows/app-ci.yml@app-workflows/v0.6.0-rc.1
    with:
      test-command: >-
        echo "//npm.pkg.github.com/:_authToken=$PACKAGES_TOKEN" >> ~/.npmrc
        && dotnet test src/App.slnx
        && pnpm --dir web install --frozen-lockfile
        && pnpm --dir web test
    secrets:
      packages-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
